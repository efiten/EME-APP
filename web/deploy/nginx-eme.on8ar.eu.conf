# Site file for eme.on8ar.eu (nginx 1.14.2: no directives newer than that).
# The rx.on8ar.eu config was not available when this was written; the cache rules follow
# the task description, not that file.
#
# The certificate lines below are managed by certbot (task 14). Do not edit them by hand.

server {
    listen 80;
    listen [::]:80;
    server_name eme.on8ar.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eme.on8ar.eu;

    # certbot-managed (task 14)
    ssl_certificate     /etc/letsencrypt/live/eme.on8ar.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eme.on8ar.eu/privkey.pem;

    root /var/www/eme.on8ar.eu;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashes these file names, so they never change under the same name.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|ico|svg)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5200;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 20s;
    }
}
