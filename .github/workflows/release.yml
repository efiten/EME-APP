name: Release

# Publiceert een GitHub-release met een ondertekende APK zodra er op main een nieuwe
# versionName staat (in app/build.gradle.kts) waarvoor nog geen release bestaat.
# De release-pull request wordt gemaakt volgens .claude/skills/release/SKILL.md.
#
# Nodig (eenmalig, door de eigenaar, zie issue #36): een environment "release", beperkt tot
# branch main, met de secrets RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS en RELEASE_KEY_PASSWORD.
#
# Optioneel: een environment "web-deploy", beperkt tot branch main, met de secret EME_DEPLOY_SSH_KEY.
# Dan installeert web-deploy de nieuwe web-app meteen op eme.on8ar.eu (zie web/deploy/README.md).
# Zonder die secret slaat web-deploy zichzelf over en installeert de server de release binnen 15 minuten.
#
# Mislukt alleen web-build of web-upload (de APK staat dan al op de release)? Gebruik "Re-run failed
# jobs" op deze run (gh run rerun <run-id> --failed), niet "gh workflow run": check ziet de release en slaat alles over.

on:
  push:
    branches: [main]
    paths: [app/build.gradle.kts]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | tr -d '\r')
          echo "versionName: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::notice::versionName '$version' is not MAJOR.MINOR.PATCH, so no release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release v$version already exists, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "docs/releases/v$version.md" ]; then
            echo "::error::docs/releases/v$version.md is missing. Every release needs its release notes."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # SHA-256 van het certificaat waarmee alle gepubliceerde APK's ondertekend zijn (v0.16 en later).
      # Dit is geen geheim: het certificaat zit in elke APK. Een andere sleutel breekt de updates.
      EXPECTED_CERT_SHA256: 124b9baeee627d2f9077a8de20f4ea846cbf62649527fcef03d78216e21a3b5e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Write the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing in environment 'release' (see issue #36)."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Check the signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          # Eén regel per handtekeningschema ("V2 Signer: certificate SHA-256 digest: ..."); allemaal dezelfde sleutel
          actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' certs.txt | sort -u | paste -sd ' ')
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with certificate $actual, expected $EXPECTED_CERT_SHA256. Not published: it would not install over the current app."
            exit 1
          fi
          cp "$apk" EME-APP.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" EME-APP.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EME APP $VERSION" \
            --notes-file "docs/releases/v$VERSION.md" \
            $prerelease

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  # The web app has no signing key: the two web jobs have no environment and no secrets.
  # web-build runs npm and Go with a read-only token and no stored credentials, then hands the
  # zip over as an artifact. web-upload holds the write token but runs no third-party code.
  # Zip layout: dist/ (the web app) and eme-web (Linux amd64 server) at the root.
  # The server updates itself from the zip (eme-web-update.timer); web/deploy/deploy-release.sh deploys at once by hand.
  web-build:
    needs: [check, release]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test the web app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-go@v6
        with:
          go-version-file: web/server/go.mod
          cache: false

      - name: Build and test the web server
        working-directory: web/server
        run: |
          go test ./...
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o eme-web .

      - name: Zip dist/ and the server
        run: |
          mkdir "$RUNNER_TEMP/pack"
          cp -r web/dist "$RUNNER_TEMP/pack/dist"
          cp web/server/eme-web "$RUNNER_TEMP/pack/eme-web"
          (cd "$RUNNER_TEMP/pack" && zip -r -q "$GITHUB_WORKSPACE/eme-web-v$VERSION.zip" dist eme-web)
          unzip -l "eme-web-v$VERSION.zip" | tail -n 5

      - uses: actions/upload-artifact@v7
        with:
          name: eme-web-zip
          path: eme-web-v${{ needs.check.outputs.version }}.zip
          if-no-files-found: error

  web-upload:
    needs: [check, web-build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: eme-web-zip

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "eme-web-v$VERSION.zip" --repo "$GITHUB_REPOSITORY"

  # Starts the update on eme.on8ar.eu at once. The key can only run "systemctl start eme-web-update.service"
  # as the user eme-deploy (forced command), which installs the latest release, the one just uploaded.
  # Without the secret the step skips itself; the update timer on the server then installs it within 15 minutes.
  web-deploy:
    needs: [check, web-upload]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: web-deploy
    permissions: {}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DEPLOY_KEY: ${{ secrets.EME_DEPLOY_SSH_KEY }}
      DEPLOY_HOST: 94.130.105.135
      # Host key of nolcluster (/etc/ssh/ssh_host_ed25519_key.pub), so the job never trusts an unknown host.
      DEPLOY_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE7oh34mgTo/C1MfYU1S6MX59Np2dB70g3sMb/XROS4h
    steps:
      - name: Start the update on eme.on8ar.eu
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::No EME_DEPLOY_SSH_KEY in the environment web-deploy: the server installs v$VERSION within 15 minutes."
            exit 0
          fi
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "eme-deploy@$DEPLOY_HOST"
          rm -f "$RUNNER_TEMP/deploy_key"

      - name: Check the version on eme.on8ar.eu
        run: |
          if [ -z "$DEPLOY_KEY" ]; then exit 0; fi
          body=$(curl -fsS --max-time 10 https://eme.on8ar.eu/api/version)
          echo "$body"
          [[ $body == *"\"version\":\"$VERSION\""* ]] || { echo "::error::eme.on8ar.eu does not run $VERSION"; exit 1; }
